<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ByteSpace – Sign In</title>

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          blue: '#003be2', lime: '#d4fb20',
          gray: { 50:'#f5f5f6', 100:'#e5e6e8', 200:'#ced0d3', 400:'#82868e', 700:'#4b4c53', 950:'#242528' },
          black700: '#4f4f4f', black400: '#888888', black200: '#d1d1d1',
        },
        fontFamily: {
          body: ['Satoshi','Inter','system-ui','-apple-system','"Segoe UI"','Arial','sans-serif'],
          head: ['Poppins','Inter','system-ui','-apple-system','"Segoe UI"','Arial','sans-serif'],
          logo: ['"Clash Display"','Poppins','system-ui','Arial','sans-serif'],
        },
        fontSize: { xs:'12px', s:'14px', m:'16px', l:'18px', 'h-xs':'20px', 'h-l':'44px' },
      },
    },
  };
</script>
<style>input::placeholder{color:#82868e}</style>
</head>
<body class="m-0 font-body text-m leading-[1.6] text-gray-950 bg-white antialiased">

<main class="relative bg-blue overflow-hidden">
  <div class="relative w-full min-h-0 lg:w-[1440px] lg:min-h-[1024px] mx-auto text-gray-50
              min-[1025px]:max-[1200px]:[zoom:.72] min-[1201px]:max-[1439px]:[zoom:.85]">

    <div class="hidden lg:block absolute inset-0 pointer-events-none
                [background-image:linear-gradient(90deg,rgba(255,255,255,.1)_2px,transparent_2px),linear-gradient(rgba(255,255,255,.1)_2px,transparent_2px)]
                [background-size:120px_120px]"></div>

    <a href="index.html" aria-label="ByteSpace home"
       class="relative z-10 lg:absolute lg:left-[122px] lg:top-[35px] inline-flex items-center gap-2 mt-8 ml-5 lg:mt-0 lg:ml-0 font-logo font-bold text-2xl">
      <img src="assets/logo_mark.png" alt="ByteSpace logo mark" class="w-[28.875px] h-[31.5px]">ByteSpace
    </a>

    <div class="relative z-10 lg:absolute lg:left-[122px] lg:top-[120px] w-auto lg:w-[475px] mt-10 mb-16 mx-5 lg:mt-0 lg:mb-0 lg:mx-0 flex flex-col gap-4">
      <h1 class="font-head font-semibold text-h-xs leading-tight tracking-[-.2px]">Sign in with ease</h1>
      <p class="text-l">Experience a seamless and efficient sign-in process that grants you instant access to a world of knowledge.</p>
    </div>

    <div class="hidden lg:block absolute inset-0 z-[1]" aria-hidden="true" id="auth-sidebar"></div>
    <script src="auth-sidebar.js"></script>

    <!-- Panel -->
    <section aria-labelledby="login-title"
             class="relative z-10 lg:absolute lg:left-[calc(50%+21px)] lg:top-[120px] w-[calc(100%-40px)] lg:w-[579px] max-w-[453px] lg:max-w-none h-auto lg:h-[784px] mx-auto lg:mx-0 mb-16 lg:mb-0 bg-white rounded-[24px] p-6 lg:p-0">
      <div class="lg:absolute lg:left-[63px] lg:top-[61px] lg:w-[453px] lg:h-[683px] flex flex-col gap-10 lg:justify-between">
        <div class="flex flex-col gap-10">
          <div>
            <p class="text-l text-blue">Sign In</p>
            <h2 id="login-title" class="font-head font-semibold text-h-l text-black leading-tight tracking-[-.44px]">Welcome Back</h2>
          </div>
          <form class="flex flex-col gap-6" autocomplete="on">
            <div class="flex flex-col gap-2">
              <label for="log-email" class="text-s font-medium leading-tight text-black">Email</label>
              <input id="log-email" name="email" type="email" placeholder="designer@example.com" required
                     class="h-[52px] w-full px-6 border border-gray-100 rounded-[12px] text-l text-gray-950 outline-none">
            </div>
            <div class="flex flex-col gap-2">
              <label for="log-password" class="text-s font-medium leading-tight text-black">Password</label>
              <input id="log-password" name="password" type="password" placeholder="********" required
                     class="h-[52px] w-full px-6 border border-gray-100 rounded-[12px] text-l text-gray-950 outline-none">
            </div>
            <button type="submit"
                    class="self-end inline-flex items-center justify-center rounded-[24px] bg-lime text-gray-950 text-l font-medium leading-tight px-6 py-3">
              Sign In
            </button>
          </form>
        </div>

        <div class="flex flex-col items-center gap-10">
          <div class="flex items-center gap-[11px] w-full">
            <span class="flex-1 h-px bg-gray-100"></span>
            <span class="text-l text-black400">or</span>
            <span class="flex-1 h-px bg-gray-100"></span>
          </div>
          <div class="flex gap-4">
            <button type="button" aria-label="Sign in with Facebook"
                    class="w-[72px] h-[72px] border border-black200 rounded-[24px] grid place-items-center">
              <img src="assets/social-facebook.png" alt="" class="w-10 h-10">
            </button>
            <button type="button" aria-label="Sign in with Google"
                    class="w-[72px] h-[72px] border border-black200 rounded-[24px] grid place-items-center">
              <img src="assets/social-google.png" alt="" class="w-10 h-10">
            </button>
          </div>
        </div>

        <p class="flex gap-1 text-m">
          <span class="text-black400">New user?</span>
          <a href="register.html" class="text-blue">Create an account</a>
        </p>
      </div>
    </section>
  </div>
</main>

</body>
</html>
